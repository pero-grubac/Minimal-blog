name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - '**.md'
      - 'readme_assets/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: blog_hub

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: blog_hub/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Django system checks
        run: python manage.py check
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blog_db
          POSTGRES_USER: blog_user
          POSTGRES_PASSWORD: blog_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog_user -d blog_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_ENGINE: ${{ matrix.database == 'postgres' && 'postgres' || '' }}
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: blog_db
      DB_USER: blog_user
      DB_PASSWORD: blog_password
      DJANGO_SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: blog_hub/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          coverage run manage.py test --verbosity 2
          coverage report --fail-under=90
          coverage xml
      - name: Upload coverage report
        if: matrix.database == 'sqlite'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: blog_hub/coverage.xml

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Home page responds
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/ > /dev/null && exit 0
            sleep 3
          done
          docker compose logs web
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
