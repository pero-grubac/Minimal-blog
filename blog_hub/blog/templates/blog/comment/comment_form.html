{% extends 'blog/base.html' %}

{% block body_block %}
<h1>New Comment</h1>
<p class="text-muted">On <a href="{% url 'blog:post_detail' pk=post.pk %}">{{ post.title }}</a>. Comments appear after approval.</p>
<form method="post" class="post-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Post comment</button>
</form>
{% endblock %}
